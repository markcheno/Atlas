[package]
name = "atlas"
version = "0.1.0"
description = "Atlas: a local-first personal AI librarian"
authors = ["Mark Chenoweth"]
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
# `_lib` suffix avoids a name clash with the binary target on Windows.
name = "atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }
same-file = "1.0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
ts-rs = "12.0.1"
uuid = { version = "1.29.1", features = ["v4"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3.27.0"
