[package]
name = "atlas"
version = "0.3.0"
description = "Atlas: a local-first personal AI librarian"
authors = ["Mark Chenoweth"]
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
# `_lib` suffix avoids a name clash with the binary target on Windows.
name = "atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
blake3 = "1.8.7"
dunce = "1.0.5"
# f16 encoding of embedding vectors in the catalog (Slice 2.2).
half = "2.7.1"
html2text = "=0.17.4"
keyring-core = "1.0.1"
pdfium-render = { version = "=0.9.5", default-features = false, features = ["pdfium_8125"] }
# The page view (Slice 3.7): PNG encoding in the worker, and the image
# as base64 over IPC. Both were already in Cargo.lock through tauri and reqwest.
png = "=0.18.1"
base64 = "=0.23.1"
rbook = "=0.7.12"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
same-file = "1.0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
starship-battery = "0.12.0"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
ts-rs = "12.0.1"
unicode-normalization = "0.1.26"
url = "2.5.8"
uuid = { version = "1.29.1", features = ["v4"] }
# The vector index (ADR 0008, ADR 0013): HNSW, cosine, f16; C++17 built by cxx.
usearch = "2.26.6"
# The version rbook uses, for the EPUB pre-scan before rbook reads anything.
zip = { version = "=9.4.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-native-keyring-store = "1.1.0"
libc = "0.2.191"
windows-sys = { version = "0.61.2", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_Security",
] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo"] }
plist = "1.10.3"

[target.'cfg(target_os = "linux")'.dependencies]
# Pure-Rust crypto for the Secret Service session (no OpenSSL to link).
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

[[bench]]
# Phase 0 benchmark harness: `cargo bench --bench inventory -- --help`.
name = "inventory"
harness = false

[[bench]]
# Phase 1 search benchmark and evaluation: `just bench-search`, `just eval`.
name = "search"
harness = false

[[bench]]
# Phase 1 extraction benchmark: `just bench-extraction`.
name = "extraction"
harness = false

[[bench]]
# Phase 2 vector index benchmark (synthetic vectors): `just bench-vectors`.
name = "vectors"
harness = false

[[bench]]
# Phase 2 embedding job and hybrid search while it runs: `just bench-embedding`.
name = "embedding"
harness = false

[[bench]]
# Phase 3 page view: rendering PDF pages in the reader's worker: `just bench-reader`.
name = "reader"
harness = false

[dev-dependencies]
plist = "1.10.3"
tempfile = "3.27.0"
