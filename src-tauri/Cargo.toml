[package]
name = "atlas"
version = "0.1.0"
description = "Atlas: a local-first personal AI librarian"
authors = ["Mark Chenoweth"]
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
# `_lib` suffix avoids a name clash with the binary target on Windows.
name = "atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.5", features = [] }
thiserror = "2.0.21"
ts-rs = "12.0.1"
