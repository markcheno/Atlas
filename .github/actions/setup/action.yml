name: Set up Atlas build
description: System packages, pnpm, Node, the pinned Rust toolchain, caches, and npm dependencies.

inputs:
  linux-extra-packages:
    description: Extra apt packages for Linux (for example the WebDriver and a virtual display).
    default: ''
  cache-key:
    description: Distinguishes Rust caches of jobs that build different profiles.
    default: debug
  app:
    description: "'false' skips what only the app needs (WebKitGTK and other system packages, pnpm, npm dependencies); the spike jobs use it."
    default: 'true'
  rust-cache:
    description: "'false' skips the Rust build cache (the spike jobs measure cold builds)."
    default: 'true'
  rust-shared-key:
    description: Shares one Rust cache between jobs that build the same thing (it replaces cache-key and the job name in the key; rust-cache still adds the OS and architecture).
    default: ''

runs:
  using: composite
  steps:
    - name: Install Linux system dependencies
      if: runner.os == 'Linux' && inputs.app == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
          librsvg2-dev libxdo-dev libssl-dev patchelf file ${{ inputs.linux-extra-packages }}

    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      if: inputs.app == 'true'

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: inputs.app == 'true'
      with:
        node-version: 24
        cache: pnpm

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: inputs.app != 'true'
      with:
        node-version: 24

    - name: Install Rust toolchain from rust-toolchain.toml
      shell: bash
      run: rustup toolchain install

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      if: inputs.rust-cache == 'true'
      with:
        workspaces: src-tauri
        key: ${{ inputs.cache-key }}
        shared-key: ${{ inputs.rust-shared-key }}

    - name: Install npm dependencies
      if: inputs.app == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
