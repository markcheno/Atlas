name: Set up Atlas build
description: System packages, pnpm, Node, PDFium (tools.lock.json), the pinned Rust toolchain, caches, and npm dependencies.

inputs:
  linux-extra-packages:
    description: Extra apt packages for Linux (for example the WebDriver and a virtual display).
    default: ''
  cache-key:
    description: Distinguishes Rust caches of jobs that build different profiles.
    default: debug
  app:
    description: "'false' skips what only the app needs (WebKitGTK and other system packages, pnpm, npm dependencies); the spike jobs use it."
    default: 'true'
  rust-cache:
    description: "'false' skips the Rust build cache (the spike jobs measure cold builds)."
    default: 'true'
  rust-shared-key:
    description: Shares one Rust cache between jobs that build the same thing (it replaces cache-key and the job name in the key; rust-cache still adds the OS and architecture).
    default: ''

runs:
  using: composite
  steps:
    - name: Install Linux system dependencies
      if: runner.os == 'Linux' && inputs.app == 'true'
      shell: bash
      # The runner's own mirror (azure.archive.ubuntu.com) has gone
      # unresolvable for hours at a time. A healthy install takes about two
      # minutes; the first try is bounded so a dead mirror costs five, and
      # the second uses Ubuntu's. Both fit the jobs' timeouts (ci.yml).
      run: |
        apt_install() {
          sudo timeout "$1" apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update &&
          sudo timeout "$1" apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev patchelf file ${{ inputs.linux-extra-packages }}
        }
        if ! apt_install 300; then
          echo "::warning::The runner's Ubuntu mirror failed; trying archive.ubuntu.com"
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] && sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#g' "$f"
          done
          apt_install 600
        fi

    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      if: inputs.app == 'true'

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: inputs.app == 'true'
      with:
        node-version: 24
        cache: pnpm

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: inputs.app != 'true'
      with:
        node-version: 24

    # tauri-build checks the bundled PDFium on every compile, tests included,
    # so it is fetched before any Rust build (scripts/fetch-pdfium.mjs).
    - name: Cache PDFium
      if: inputs.app == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: src-tauri/vendor/pdfium
        key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools.lock.json') }}

    - name: Fetch PDFium
      if: inputs.app == 'true'
      shell: bash
      run: node scripts/fetch-pdfium.mjs

    - name: Install Rust toolchain from rust-toolchain.toml
      shell: bash
      run: rustup toolchain install

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      if: inputs.rust-cache == 'true'
      with:
        workspaces: src-tauri
        key: ${{ inputs.cache-key }}
        shared-key: ${{ inputs.rust-shared-key }}

    - name: Install npm dependencies
      if: inputs.app == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
