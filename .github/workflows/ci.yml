name: CI

# Three tiers (docs/architecture.md, "CI tiers"); the plan job picks one:
#   full:  every OS. Checks, tests, debug bundles, smoke tests, benchmarks,
#          release bundles. Pushes to main, tags, pull requests, and manual
#          runs (`just ci-remote`).
#   quick: Linux checks and tests only. Pushes to slice-* branches, and
#          manual runs with scope=quick (`just ci-remote quick`).
#   docs:  lint only (Prettier checks Markdown). Branch pushes that change
#          only Markdown files, docs/, or spikes/ (spikes.yml covers spikes).
#   evidence: manual only (`just ci-remote evidence`). Reads the 30k text
#          fixture on every OS and fails unless every file is read (the
#          Phase 1 close-out's extraction gate, phase1-spec §1.3). Nothing
#          else runs; it has its own concurrency group.
on:
  push:
    branches: [main, 'slice-*']
    tags: ['phase*/**']
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: 'full: every OS, smoke tests, benchmarks, release bundles. quick: Linux checks and tests. evidence: 30k text extraction on every OS.'
        type: choice
        options: [full, quick, evidence]
        default: full

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}${{ inputs.scope == 'evidence' && '-evidence' || '' }}
  cancel-in-progress: true

env:
  TAURI_DRIVER_VERSION: 2.1.0

# Actions are pinned to full commit SHAs; the comment records the release.
# Shared setup lives in .github/actions/setup.
jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Choose the scope
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          REQUESTED: ${{ inputs.scope }}
        run: |
          case "$EVENT" in
            workflow_dispatch) scope="${REQUESTED:-full}" ;;
            push) if [[ "$REF" == refs/heads/slice-* ]]; then scope=quick; else scope=full; fi ;;
            *) scope=full ;;
          esac
          changed=""
          if [[ "$EVENT" == push && "$REF" == refs/heads/* ]]; then
            base="$BEFORE"
            # A new branch (or a force push) has no usable "before".
            if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="$(git merge-base origin/main HEAD)"
            fi
            changed="$(git diff --name-only "$base" HEAD)"
            if [[ -n "$changed" ]] && ! grep -qvE '\.md$|^docs/|^spikes/' <<<"$changed"; then
              scope=docs
            fi
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          {
            echo "### CI scope: $scope"
            echo
            echo "Event \`$EVENT\` on \`$REF\`. To run more, use \`just ci-remote\` (full), \`just ci-remote quick\` or \`just ci-remote evidence\`."
            if [[ -n "$changed" ]]; then
              echo
              echo "Changed files: $(wc -l <<<"$changed" | tr -d ' ')"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Quick tier: the checks and tests of the full Linux job, without bundles.
  quick:
    name: Quick (Linux x64)
    needs: plan
    if: needs.plan.outputs.scope == 'quick'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Shares the full Linux job's cache, so a new slice branch starts warm
      # from main's.
      - uses: ./.github/actions/setup
        with:
          rust-shared-key: check

      - name: Rust format, clippy, tests
        run: pnpm check:rust

      - name: Generated bindings are committed
        run: pnpm check:bindings

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Docs tier: ESLint and Prettier (which checks Markdown); no Rust.
  docs:
    name: Docs (lint)
    needs: plan
    if: needs.plan.outputs.scope == 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # Checks, tests, debug bundles, and (Windows, Linux) the WebDriver smoke test.
  check-and-build:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            bundles: app,dmg
          - name: Windows x64
            os: windows-latest
            bundles: nsis
          - name: Linux x64
            os: ubuntu-24.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          linux-extra-packages: webkit2gtk-driver xvfb dbus
          rust-shared-key: check

      - name: Rust format, clippy, tests
        run: pnpm check:rust

      - name: Generated bindings are committed
        run: pnpm check:bindings

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Build debug bundles
        run: pnpm tauri build --debug --ci --bundles ${{ matrix.bundles }}

      # PDFium is bundled and signed, and the extraction worker loads it and
      # passes its self-test from the bundle (phase1-spec §14, Slice 1.2).
      - name: PDFium in the signed bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=src-tauri/target/debug/bundle/macos/Atlas.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app/Contents/Frameworks/libpdfium.dylib"
          node scripts/worker-hello.mjs "$app/Contents/MacOS/atlas" --label "${{ matrix.name }} debug .app"

      - name: Extraction worker says hello (Windows, Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: node scripts/worker-hello.mjs "src-tauri/target/debug/atlas${{ runner.os == 'Windows' && '.exe' || '' }}" --label "${{ matrix.name }} debug build"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-${{ runner.os }}-${{ runner.arch }}-debug
          path: |
            src-tauri/target/debug/bundle/**/*.dmg
            src-tauri/target/debug/bundle/**/*-setup.exe
            src-tauri/target/debug/bundle/**/*.AppImage
            src-tauri/target/debug/bundle/**/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Install tauri-driver
        if: runner.os != 'macOS'
        shell: bash
        run: |
          if ! tauri-driver --help >/dev/null 2>&1; then
            cargo install tauri-driver --version "$TAURI_DRIVER_VERSION" --locked
          fi

      # A session bus, as on a real desktop: without one, GTK and WebKit wait
      # about 25 s for the accessibility bus on every launch.
      - name: Smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a node e2e/smoke.mjs --out "$RUNNER_TEMP/e2e"

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $driver = Join-Path $env:EDGEWEBDRIVER 'msedgedriver.exe'
          & $driver --version
          $wv = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue
          Write-Host "WebView2 runtime: $($wv.pv)"
          node e2e/smoke.mjs --native-driver $driver --out "$env:RUNNER_TEMP/e2e"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && runner.os != 'macOS'
        with:
          name: e2e-${{ runner.os }}
          path: ${{ runner.temp }}/e2e
          if-no-files-found: warn
          retention-days: 30

  # Measurements only; never fails on numbers (docs/benchmarks.md).
  bench:
    name: Benchmarks ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest }
          - { name: Windows x64, os: windows-latest }
          - { name: Linux x64, os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-key: release
      - name: Run benchmarks
        shell: bash
        # Search and extraction on the 1k text fixture: the 30k one (P1-19)
        # runs on the reference machine (`just bench-search`,
        # `just bench-extraction`); on Windows runners it took over 40
        # minutes.
        # The vector index at 100,000 synthetic vectors (Phase 2, Slice 2.2);
        # 300,000 and 1,000,000 run on the reference machine.
        run: node scripts/bench.mjs --out "$RUNNER_TEMP/bench" --search-size 1k --vectors-size 100000
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-${{ runner.os }}
          path: |
            ${{ runner.temp }}/bench/*.json
            ${{ runner.temp }}/bench/*.md
          if-no-files-found: warn
          retention-days: 90

  # Close-out evidence (phase1-spec §1.3, §14): the 30k text fixture read on
  # every OS, every file "Text ready". Manual: `just ci-remote evidence`.
  evidence:
    name: Evidence ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.scope == 'evidence'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest }
          - { name: Windows x64, os: windows-latest }
          - { name: Linux x64, os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-key: release
      - name: Read the 30k text fixture
        shell: bash
        run: node scripts/bench.mjs --out "$RUNNER_TEMP/evidence" --evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-${{ runner.os }}
          path: |
            ${{ runner.temp }}/evidence/*.json
            ${{ runner.temp }}/evidence/*.md
          if-no-files-found: warn
          retention-days: 90

  # Release bundles: unsigned development builds (docs/packaging.md).
  package:
    name: Release bundle ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.scope == 'full' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest, bundles: 'app,dmg' }
          - { name: Windows x64, os: windows-latest, bundles: nsis }
          - { name: Linux x64, os: ubuntu-24.04, bundles: 'appimage,deb' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-key: release
      - name: Build release bundles
        run: pnpm tauri build --ci --bundles ${{ matrix.bundles }}
      - name: Bundle sizes
        shell: bash
        run: node scripts/bundle-sizes.mjs src-tauri/target/release | tee -a "$GITHUB_STEP_SUMMARY"

      # The worker finds PDFium where each installer puts it.
      - name: PDFium in the signed release bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=src-tauri/target/release/bundle/macos/Atlas.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements - "$app"
          node scripts/worker-hello.mjs "$app/Contents/MacOS/atlas" --label "${{ matrix.name }} release .app"

      - name: Extraction worker in the .deb and AppImage layouts (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          deb="$RUNNER_TEMP/deb"
          dpkg-deb -x src-tauri/target/release/bundle/deb/*.deb "$deb"
          find "$deb/usr/lib" -maxdepth 2
          node scripts/worker-hello.mjs "$deb/usr/bin/atlas" --label "Linux .deb layout"
          appimage=$(ls src-tauri/target/release/bundle/appimage/*.AppImage)
          APPIMAGE_EXTRACT_AND_RUN=1 node scripts/worker-hello.mjs "$appimage" --runs 3 --label "Linux AppImage"

      - name: Extraction worker after a per-user install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'AtlasInstall'
          Start-Process -Wait -FilePath $installer.FullName -ArgumentList '/S', "/D=$dir"
          Get-ChildItem $dir | Format-Table Name, Length
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          node scripts/worker-hello.mjs $exe.FullName --label "Windows installed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-${{ runner.os }}-${{ runner.arch }}-release
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*-setup.exe
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: error
          retention-days: 30
