name: Spikes

# Slice 0.9 extraction and vector-engine spike (docs/spike-0.9.md).
# Manual only: it never runs on push to main, so app CI stays fast.
on:
  # TEMPORARY (remove before merging Slice 0.9): GitHub can dispatch a
  # workflow only once it exists on the default branch.
  push:
    branches: ['slice-*']
    paths: ['spikes/**', '.github/workflows/spikes.yml']
  workflow_dispatch:
    inputs:
      suite:
        description: Which part to run
        type: choice
        options: [all, vectors, extraction, docling, builds]
        default: all
      n:
        description: Vectors per data set
        default: '100000'

permissions:
  contents: read

concurrency:
  group: spikes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vectors:
    name: Vectors ${{ matrix.name }}
    if: (inputs.suite || 'all') == 'all' || inputs.suite == 'vectors'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest }
          - { name: Windows x64, os: windows-latest }
          - { name: Linux x64, os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      # LanceDB's build tree is deep; keep Windows paths short.
      - name: Long paths and a short target dir (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --system core.longpaths true
          echo 'CARGO_TARGET_DIR=C:\t' >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          app: 'false'
          rust-cache: 'false'

      - name: Free disk
        shell: bash
        run: df -h . || true

      - name: Pinned tools (protoc)
        run: node spikes/scripts/fetch-tools.mjs protoc

      - name: Cold release build (timed)
        shell: bash
        working-directory: spikes/vector-bench
        run: |
          export PROTOC=$(node -p "require('../.tools/paths.json').protoc.bin")
          start=$(date +%s)
          cargo build --release --locked --workspace --timings
          echo "Cold build of the vector workspace: $(( $(date +%s) - start )) s on $(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo "$NUMBER_OF_PROCESSORS") cores" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run engines
        shell: bash
        run: node spikes/scripts/run-vectors.mjs --no-build --n "${{ inputs.n || '100000' }}" --out "$RUNNER_TEMP/spikes"

      - name: Collect build timings
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/spikes"
          t="${CARGO_TARGET_DIR:-spikes/vector-bench/target}"
          cp "$t"/cargo-timings/cargo-timing.html "$RUNNER_TEMP/spikes/vector-cargo-timing.html" 2>/dev/null || true
          ls -la "$t/release" | grep -E 'baseline|vec-' | tee "$RUNNER_TEMP/spikes/vector-binaries.txt" || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spike-vectors-${{ runner.os }}
          path: |
            ${{ runner.temp }}/spikes/*.json
            ${{ runner.temp }}/spikes/*.md
            ${{ runner.temp }}/spikes/*.html
            ${{ runner.temp }}/spikes/*.txt
          if-no-files-found: warn
          retention-days: 90

  extraction:
    name: Extraction ${{ matrix.name }}
    if: (inputs.suite || 'all') == 'all' || inputs.suite == 'extraction'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest }
          - { name: Windows x64, os: windows-latest }
          - { name: Linux x64, os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          app: 'false'
          rust-cache: 'false'

      - name: Pinned tools (PDFium)
        run: node spikes/scripts/fetch-tools.mjs pdfium

      - name: Corpus checksums
        run: node spikes/scripts/check-corpus.mjs

      - name: Build and run extractors
        shell: bash
        run: node spikes/scripts/run-extraction.mjs --out "$RUNNER_TEMP/spikes"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spike-extraction-${{ runner.os }}
          path: |
            ${{ runner.temp }}/spikes/*.json
            ${{ runner.temp }}/spikes/*.md
          if-no-files-found: warn
          retention-days: 90

  docling:
    name: Docling sidecar ${{ matrix.name }}
    if: (inputs.suite || 'all') == 'all' || inputs.suite == 'docling'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest }
          - { name: Windows x64, os: windows-latest }
          - { name: Linux x64, os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          app: 'false'
          rust-cache: 'false'

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Free disk
        shell: bash
        run: df -h . || true

      - name: Docling models (cached by Docling version)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: spikes/extraction-bench/sidecar/docling/build/models
          key: docling-models-2.149.0-layout-tableformer

      - name: Freeze Docling (PyInstaller onedir)
        shell: bash
        working-directory: spikes/extraction-bench/sidecar/docling
        run: |
          uv sync --locked --python 3.12
          uv run python build.py
          cat build/size.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run Docling on the corpus
        shell: bash
        run: |
          (cd spikes/extraction-bench && cargo build --release --locked -p score)
          exe=$(node -p "require('./spikes/extraction-bench/sidecar/docling/build/size.json').executable")
          node spikes/scripts/run-extraction.mjs --no-build --only docling --docling "$exe" --out "$RUNNER_TEMP/spikes"
          cp spikes/extraction-bench/sidecar/docling/build/size.json "$RUNNER_TEMP/spikes/docling-size-${RUNNER_OS}.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spike-docling-${{ runner.os }}
          path: |
            ${{ runner.temp }}/spikes/*.json
            ${{ runner.temp }}/spikes/*.md
          if-no-files-found: warn
          retention-days: 90

  builds:
    name: Build cost ${{ matrix.name }}
    if: (inputs.suite || 'all') == 'all' || inputs.suite == 'builds'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest }
          - { name: Windows x64, os: windows-latest }
          - { name: Linux x64, os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - name: Long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          app: 'false'
          rust-cache: 'false'

      - name: Pinned tools (protoc)
        run: node spikes/scripts/fetch-tools.mjs protoc

      - name: Clean build of each candidate
        shell: bash
        run: node spikes/scripts/measure-builds.mjs --out "$RUNNER_TEMP/spikes"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spike-builds-${{ runner.os }}
          path: |
            ${{ runner.temp }}/spikes/*.json
            ${{ runner.temp }}/spikes/*.md
          if-no-files-found: warn
          retention-days: 90
