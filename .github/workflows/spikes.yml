name: Spikes

# Slice 0.9 extraction and vector-engine spike (docs/spike-0.9.md), and
# the Slice 4.2 OCR spike (docs/spike-ocr.md, ADR 0020).
# Manual only (Actions › Spikes › Run workflow, or
# `gh workflow run spikes.yml -f suite=all`), so app CI stays fast.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which part to run
        type: choice
        options: [all, vectors, extraction, docling, builds, ocr, ocr-builds, ocr-installers]
        default: all
      n:
        description: Vectors per data set
        default: '100000'

permissions:
  contents: read

concurrency:
  # One run per suite and branch: dispatching one suite doesn't cancel another.
  group: spikes-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: true

jobs:
  vectors:
    name: Vectors ${{ matrix.name }}
    if: inputs.suite == 'all' || inputs.suite == 'vectors'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest }
          - { name: Windows x64, os: windows-latest }
          - { name: Linux x64, os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      # LanceDB's build tree is deep; keep Windows paths short.
      - name: Long paths and a short target dir (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --system core.longpaths true
          echo 'CARGO_TARGET_DIR=C:\t' >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          app: 'false'
          rust-cache: 'false'

      - name: Free disk
        shell: bash
        run: df -h . || true

      - name: Pinned tools (protoc)
        run: node spikes/scripts/fetch-tools.mjs protoc

      - name: Cold release build (timed)
        shell: bash
        working-directory: spikes/vector-bench
        run: |
          export PROTOC=$(node -p "require('../.tools/paths.json').protoc.bin")
          start=$(date +%s)
          cargo build --release --locked --workspace --timings
          echo "Cold build of the vector workspace: $(( $(date +%s) - start )) s on $(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo "$NUMBER_OF_PROCESSORS") cores" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run engines
        shell: bash
        run: node spikes/scripts/run-vectors.mjs --no-build --n "${{ inputs.n }}" --queries 200 --out "$RUNNER_TEMP/spikes"

      - name: Collect build timings
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/spikes"
          t="${CARGO_TARGET_DIR:-spikes/vector-bench/target}"
          cp "$t"/cargo-timings/cargo-timing.html "$RUNNER_TEMP/spikes/vector-cargo-timing.html" 2>/dev/null || true
          ls -la "$t/release" | grep -E 'baseline|vec-' | tee "$RUNNER_TEMP/spikes/vector-binaries.txt" || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spike-vectors-${{ runner.os }}
          path: |
            ${{ runner.temp }}/spikes/*.json
            ${{ runner.temp }}/spikes/*.md
            ${{ runner.temp }}/spikes/*.html
            ${{ runner.temp }}/spikes/*.txt
          if-no-files-found: warn
          retention-days: 90

  extraction:
    name: Extraction ${{ matrix.name }}
    if: inputs.suite == 'all' || inputs.suite == 'extraction'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest }
          - { name: Windows x64, os: windows-latest }
          - { name: Linux x64, os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          app: 'false'
          rust-cache: 'false'

      - name: Pinned tools (PDFium)
        run: node spikes/scripts/fetch-tools.mjs pdfium

      - name: Corpus checksums
        run: node spikes/scripts/check-corpus.mjs

      - name: Build and run extractors
        shell: bash
        run: node spikes/scripts/run-extraction.mjs --out "$RUNNER_TEMP/spikes"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spike-extraction-${{ runner.os }}
          path: |
            ${{ runner.temp }}/spikes/*.json
            ${{ runner.temp }}/spikes/*.md
          if-no-files-found: warn
          retention-days: 90

  docling:
    name: Docling sidecar ${{ matrix.name }}
    if: inputs.suite == 'all' || inputs.suite == 'docling'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest }
          - { name: Windows x64, os: windows-latest }
          - { name: Linux x64, os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          app: 'false'
          rust-cache: 'false'

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Free disk
        shell: bash
        run: df -h . || true

      - name: Docling models (cached by Docling version)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: spikes/extraction-bench/sidecar/docling/build/models
          key: docling-models-2.149.0-layout-tableformer

      - name: Freeze Docling (PyInstaller onedir)
        shell: bash
        working-directory: spikes/extraction-bench/sidecar/docling
        run: |
          uv sync --locked --python 3.12
          uv run python build.py
          cat build/size.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run Docling on the corpus
        shell: bash
        run: |
          (cd spikes/extraction-bench && cargo build --release --locked -p score)
          exe=$(node -p "require('./spikes/extraction-bench/sidecar/docling/build/size.json').executable")
          node spikes/scripts/run-extraction.mjs --no-build --only docling --docling "$exe" --out "$RUNNER_TEMP/spikes"
          cp spikes/extraction-bench/sidecar/docling/build/size.json "$RUNNER_TEMP/spikes/docling-size-${RUNNER_OS}.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spike-docling-${{ runner.os }}
          path: |
            ${{ runner.temp }}/spikes/*.json
            ${{ runner.temp }}/spikes/*.md
          if-no-files-found: warn
          retention-days: 90

  builds:
    name: Build cost ${{ matrix.name }}
    if: inputs.suite == 'all' || inputs.suite == 'builds'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest }
          - { name: Windows x64, os: windows-latest }
          - { name: Linux x64, os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - name: Long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          app: 'false'
          rust-cache: 'false'

      - name: Pinned tools (protoc, cmake)
        run: node spikes/scripts/fetch-tools.mjs protoc cmake

      - name: Clean build of each candidate
        shell: bash
        run: node spikes/scripts/measure-builds.mjs --out "$RUNNER_TEMP/spikes"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spike-builds-${{ runner.os }}
          path: |
            ${{ runner.temp }}/spikes/*.json
            ${{ runner.temp }}/spikes/*.md
          if-no-files-found: warn
          retention-days: 90

  # ---------------------------------------------------------- the OCR spike

  # The corpus is built once, on Linux, and read by every OS's job, so the
  # pages are identical everywhere (resampling may differ across platforms).
  ocr-corpus:
    name: OCR corpus
    if: inputs.suite == 'all' || inputs.suite == 'ocr'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Pinned tools (typst)
        run: node spikes/scripts/fetch-tools.mjs typst

      - name: Cached downloads (Wikisource, Commons)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: spikes/ocr-bench/build/cache
          key: ocr-corpus-${{ hashFiles('spikes/ocr-bench/corpus/manifest.json') }}

      - name: Build and check the corpus
        working-directory: spikes/ocr-bench/generator
        run: |
          uv sync --locked --python 3.12
          uv run python -m unittest
          uv run corpus.py make
          uv run corpus.py check

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocr-corpus
          path: spikes/ocr-bench/build/corpus
          retention-days: 7

  ocr:
    name: OCR ${{ matrix.name }}
    needs: ocr-corpus
    if: inputs.suite == 'all' || inputs.suite == 'ocr'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest }
          - { name: Windows x64, os: windows-latest }
          - { name: Linux x64, os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - name: Long paths and a short target dir (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --system core.longpaths true
          echo 'CARGO_TARGET_DIR=C:\o' >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          app: 'false'
          rust-cache: 'false'

      - name: Pinned tools and models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: spikes/.tools
          key: ocr-tools-${{ runner.os }}-${{ hashFiles('spikes/tools.lock.json', 'tools.lock.json') }}

      - name: Fetch what the cache doesn't hold
        run: node spikes/scripts/fetch-tools.mjs pdfium onnxruntime cmake ppocr-models tessdata

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ocr-corpus
          path: spikes/ocr-bench/build/corpus

      - name: Build and run the engines
        shell: bash
        run: node spikes/scripts/run-ocr.mjs --out "$RUNNER_TEMP/spikes"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spike-ocr-${{ runner.os }}
          path: |
            ${{ runner.temp }}/spikes/*.json
            ${{ runner.temp }}/spikes/*.md
          if-no-files-found: warn
          retention-days: 90

  ocr-builds:
    name: OCR build cost ${{ matrix.name }}
    if: inputs.suite == 'ocr-builds'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest }
          - { name: Windows x64, os: windows-latest }
          - { name: Linux x64, os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          app: 'false'
          rust-cache: 'false'

      - name: Pinned tools (cmake)
        run: node spikes/scripts/fetch-tools.mjs cmake

      - name: Clean build of each engine
        shell: bash
        run: node spikes/scripts/measure-builds.mjs --workspace ocr-bench --out "$RUNNER_TEMP/spikes"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spike-ocr-builds-${{ runner.os }}
          path: |
            ${{ runner.temp }}/spikes/*.json
            ${{ runner.temp }}/spikes/*.md
          if-no-files-found: warn
          retention-days: 90

  # Each engine in Atlas's real installers, and its check from where they
  # install it (ADR 0020's stand-in for the worker check).
  ocr-installers:
    name: OCR installers ${{ matrix.name }}
    if: inputs.suite == 'ocr-installers'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest }
          - { name: Windows x64, os: windows-latest }
          - { name: Linux x64, os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - name: Long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          cache-key: ocr-installers

      - name: Pinned tools and models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: spikes/.tools
          key: ocr-tools-${{ runner.os }}-${{ hashFiles('spikes/tools.lock.json', 'tools.lock.json') }}

      - name: Fetch what the cache doesn't hold
        run: node spikes/scripts/fetch-tools.mjs pdfium onnxruntime cmake ppocr-models tessdata

      - name: Build the engines
        shell: bash
        run: node spikes/scripts/run-ocr.mjs --build-only

      - name: Installers with each engine, and the check from each layout
        shell: bash
        run: node spikes/scripts/ocr-installed.mjs --out "$RUNNER_TEMP/spikes"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spike-ocr-installers-${{ runner.os }}
          path: |
            ${{ runner.temp }}/spikes/*.json
            ${{ runner.temp }}/spikes/*.md
          if-no-files-found: warn
          retention-days: 90
