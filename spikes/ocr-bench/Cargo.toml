# Slice 4.2 OCR spike (docs/spike-ocr.md, ADR 0020). Not part of the app
# build: a separate workspace so each engine's build time and size can be
# measured on its own, as Slice 0.9's benches are.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
ocrbench = { path = "crates/common" }
xbench = { path = "../extraction-bench/crates/common" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
