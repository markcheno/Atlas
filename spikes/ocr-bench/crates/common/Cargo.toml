[package]
name = "ocrbench"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# Scoring for the OCR spike (ADR 0020's definitions), the engines' contract
# and the page render. It reuses Slice 0.9's tokenizer and reading-order
# measure (`xbench`), which also links what the app links, and PDFium as
# the app pins it, so every engine binary's size delta against `baseline`
# measures only the engine.
[dependencies]
xbench.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-normalization = "0.1.26"
pdfium-render = { version = "=0.9.5", default-features = false, features = ["pdfium_8125"] }
png = "=0.18.1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
