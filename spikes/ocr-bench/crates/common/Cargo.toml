[package]
name = "ocrbench"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# Scoring for the OCR spike (ADR 0020's definitions). It reuses Slice 0.9's
# tokenizer and reading-order measure (`xbench`), which also links what the
# app links, so every engine binary's size delta measures only the engine.
[dependencies]
xbench.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-normalization = "0.1.26"
