[package]
name = "vec-sqlite-alpha"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# sqlite-vec 0.1.10-alpha.4 is built from C sources vendored from the tag's
# commit (04d28bd) into csrc/: the published crate leaves out
# sqlite-vec-diskann.c and the other included files, so it doesn't build.
[dependencies]
vbench.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.41.1", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
libsqlite3-sys = { version = "0.39.1", features = ["bundled"] }

[build-dependencies]
cc = "1"
