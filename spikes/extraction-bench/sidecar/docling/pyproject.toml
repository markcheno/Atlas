[project]
name = "atlas-docling"
version = "0.1.0"
description = "Docling frozen into a standalone executable for the Slice 0.9 spike (docs/spike-0.9.md)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "docling==2.149.0",
    "pyinstaller==6.22.3",
    "torch",
    "torchvision",
]

[tool.uv]
package = false

# CPU-only PyTorch on Linux and Windows: the default Linux wheels pull in
# several GB of CUDA libraries. macOS wheels are CPU (and MPS) already.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
