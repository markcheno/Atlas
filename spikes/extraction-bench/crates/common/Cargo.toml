[package]
name = "xbench"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# Every binary links what the app already links (bundled SQLite, a
# multi-threaded Tokio runtime, serde_json, unicode-normalization), so
# binary-size deltas against the baseline measure only the extractor.
[dependencies]
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.41.1", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
unicode-normalization = "0.1.26"
similar = "3.2.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }
