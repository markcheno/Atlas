# Slice 0.9 extraction spike (docs/spike-0.9.md). Not part of the app
# build: a separate workspace so each candidate's build time and binary
# size can be measured on its own.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
xbench = { path = "crates/common" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
